apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: everything
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  ignoreDifferences:
  - group: ''
    jsonPointers:
    - /data
    kind: Secret
    name: cilium-ca
    namespace: kube-system
  - group: ''
    jsonPointers:
    - /data
    kind: Secret
    name: hubble-server-certs
    namespace: kube-system
  - group: ''
    jsonPointers:
    - /data
    kind: Secret
    name: hubble-relay-client-certs
    namespace: kube-system
  project: default
  source:
    path: everything
    repoURL: https://github.com/Lillecarl/hetzkube.git
    targetRevision: deploy
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
