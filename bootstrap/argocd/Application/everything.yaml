apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: everything
  namespace: argocd
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: everything
    repoURL: https://github.com/Lillecarl/hetzkube.git
    targetRevision: deploy
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
