apiVersion: v1
ekn:
  gitOpsTarget: bootstrap
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: repo-server
    app.kubernetes.io/name: argocd-repo-server
    app.kubernetes.io/part-of: argocd
  name: argocd-repo-server
  namespace: argocd
spec:
  ipFamilyPolicy: RequireDualStack
  ports:
  - name: metrics
    port: 8084
    protocol: TCP
    targetPort: 8084
  - name: server
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app.kubernetes.io/name: argocd-repo-server
