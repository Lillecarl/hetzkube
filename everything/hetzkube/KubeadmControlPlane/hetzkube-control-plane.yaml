apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: hetzkube-control-plane
  namespace: hetzkube
spec:
  kubeadmConfigSpec:
    clusterConfiguration:
      apiServer:
        certSANs:
        - 127.0.0.1
        - localhost
        - kubernetes.lillecarl.com
        extraArgs:
          feature-gates: ImageVolume=true,KubeletPSI=true,ContainerRestartRules=true
          oidc-client-id: kubernetes
          oidc-groups-claim: groups
          oidc-issuer-url: https://keycloak.lillecarl.com/realms/auth
          oidc-username-claim: sub
      controllerManager:
        extraArgs:
          allocate-node-cidrs: 'false'
          controllers: '*,bootstrapsigner,tokencleaner,-nodeipam'
          feature-gates: ImageVolume=true,KubeletPSI=true,ContainerRestartRules=true
      etcd: {}
      scheduler:
        extraArgs:
          feature-gates: ImageVolume=true,KubeletPSI=true,ContainerRestartRules=true
    files:
    - content: '{"apiVersion":"kubelet.config.k8s.io/v1beta1","cgroupDriver":"systemd","cloudProvider":"external","clusterDNS":["10.134.0.10","fdce:9c4d:dcba::10"],"failSwapOn":false,"featureGates":{"ContainerRestartRules":true,"ImageVolume":true,"KubeletPSI":true},"imageMaximumGCAge":"12h","kind":"KubeletConfiguration","resolvConf":"/etc/resolv.conf","shutdownGracePeriod":"30s","shutdownGracePeriodCriticalPods":"10s"}'
      owner: root:root
      path: /etc/kubernetes/patches/kubeletconfiguration+strategic.json
      permissions: '0644'
    initConfiguration:
      nodeRegistration:
        ignorePreflightErrors:
        - Swap
        kubeletExtraArgs:
          cloud-provider: external
        taints:
        - effect: PreferNoSchedule
          key: node-role.kubernetes.io/control-plane
      patches:
        directory: /etc/kubernetes/patches
      skipPhases:
      - addon/coredns
      - addon/kube-proxy
    joinConfiguration:
      nodeRegistration:
        ignorePreflightErrors:
        - Swap
        kubeletExtraArgs:
          cloud-provider: external
        taints:
        - effect: PreferNoSchedule
          key: node-role.kubernetes.io/control-plane
      patches:
        directory: /etc/kubernetes/patches
    postKubeadmCommands:
    - '#! /usr/bin/env bash

      # Install admin config to node

      install -D --mode=0600 --owner=hetzkube /etc/kubernetes/admin.conf /home/hetzkube/.kube/config

      '
    preKubeadmCommands:
    - '#! /usr/bin/env bash

      set -x

      export PATH=/run/current-system/sw/bin:$PATH

      # Clone latest config

      git clone https://github.com/lillecarl/hetzkube.git /etc/hetzkube

      # Get node info

      nix run --file /etc/hetzkube pkgs.hetzInfo

      # Rebuild with new config, TODO: split image and prod configs

      nixos-rebuild switch --file /etc/hetzkube/ --attr nixosConfigurations.image-$(nix
      eval --raw --impure --expr builtins.currentSystem)

      '
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HCloudMachineTemplate
      name: hetzkube-control-plane-v2
  replicas: 1
  version: v1.36.1
