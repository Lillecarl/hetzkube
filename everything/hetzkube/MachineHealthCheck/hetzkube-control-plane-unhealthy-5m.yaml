apiVersion: cluster.x-k8s.io/v1beta1
kind: MachineHealthCheck
metadata:
  name: hetzkube-control-plane-unhealthy-5m
  namespace: hetzkube
spec:
  clusterName: hetzkube
  maxUnhealthy: 100%
  nodeStartupTimeout: 15m
  remediationTemplate:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: HCloudRemediationTemplate
    name: control-plane-remediation-request
  selector:
    matchLabels:
      cluster.x-k8s.io/control-plane: ''
  unhealthyConditions:
  - status: Unknown
    timeout: 180s
    type: Ready
  - status: 'False'
    timeout: 180s
    type: Ready
