apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: updater
    app.kubernetes.io/component-instance: vertical-pod-autoscaler-updater
    app.kubernetes.io/instance: vertical-pod-autoscaler
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: vertical-pod-autoscaler
    app.kubernetes.io/version: 1.7.0
    helm.sh/chart: vertical-pod-autoscaler-1.12.0
  name: vertical-pod-autoscaler-updater
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: updater
      app.kubernetes.io/instance: vertical-pod-autoscaler
      app.kubernetes.io/name: vertical-pod-autoscaler
  template:
    metadata:
      labels:
        app.kubernetes.io/component: updater
        app.kubernetes.io/instance: vertical-pod-autoscaler
        app.kubernetes.io/name: vertical-pod-autoscaler
    spec:
      containers:
      - args:
        - --v=4
        - --address=:8943
        - --min-replicas=1
        - --eviction-tolerance=1.0
        - --in-recommendation-bounds-eviction-lifetime-threshold=3h
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        image: registry.k8s.io/autoscaling/vpa-updater:1.7.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 10
          httpGet:
            path: /health-check
            port: http-metrics
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: updater
        ports:
        - containerPort: 8943
          name: http-metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 10
          httpGet:
            path: /health-check
            port: http-metrics
          initialDelaySeconds: 0
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
      securityContext:
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: vertical-pod-autoscaler-updater
