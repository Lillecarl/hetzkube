apiVersion: v1
data:
  Corefile: ".:53 {\n    log\n    errors\n    health {\n       lameduck 5s\n    }\n
    \   ready\n    kubernetes cluster.local in-addr.arpa ip6.arpa {\n       pods insecure\n
    \      endpoint_pod_names\n       fallthrough in-addr.arpa ip6.arpa\n       ttl
    30\n    }\n    prometheus :9153\n    forward . 1.1.1.1 {\n       max_concurrent
    1000\n    }\n    cache 30\n    loop\n    reload\n    loadbalance\n}\n"
ekn:
  gitOpsTarget: everything
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
