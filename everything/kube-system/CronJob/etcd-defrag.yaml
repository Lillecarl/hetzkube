apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag
  namespace: kube-system
spec:
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: etcd-defrag
        spec:
          containers:
          - command:
            - /nix/store/7sgyr7q091pgx8whnmmh0rxhjq55s3zz-tini-0.19.0/bin/tini
            - --
            - /nix/store/2a7zpf6mrn96yrjkkl3399fjh2568yqy-etcd-defrag/bin/etcd-defrag
            image: ghcr.io/lillecarl/nix-csi/scratch:1.0.1
            name: etcd-defrag
          restartPolicy: OnFailure
          serviceAccountName: etcd-defrag
      ttlSecondsAfterFinished: 604800
  schedule: 0 3 * * *
