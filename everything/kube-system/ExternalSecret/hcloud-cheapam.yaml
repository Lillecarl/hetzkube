apiVersion: external-secrets.io/v1
ekn:
  gitOpsTarget: everything
kind: ExternalSecret
metadata:
  name: hcloud-cheapam
  namespace: kube-system
spec:
  data:
  - remoteRef:
      key: name:hcloud-token
    secretKey: token
  refreshInterval: 30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway
  target:
    template:
      type: Opaque
