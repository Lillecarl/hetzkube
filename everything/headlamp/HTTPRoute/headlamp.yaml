apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    external-dns.alpha.kubernetes.io/ttl: '60'
  name: headlamp
  namespace: headlamp
spec:
  hostnames:
  - headlamp.lillecarl.com
  parentRefs:
  - name: default
    namespace: kube-system
  rules:
  - backendRefs:
    - name: headlamp
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
