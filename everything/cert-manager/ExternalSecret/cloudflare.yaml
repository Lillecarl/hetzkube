apiVersion: external-secrets.io/v1
ekn:
  gitOpsTarget: everything
kind: ExternalSecret
metadata:
  name: cloudflare
  namespace: cert-manager
spec:
  data:
  - remoteRef:
      key: name:cloudflare-token
    secretKey: token
  refreshInterval: 30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway
  target:
    template:
      type: Opaque
