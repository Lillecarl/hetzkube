apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pg0-grafana
  namespace: database
spec:
  data:
  - remoteRef:
      key: grafana-db
      property: username
    secretKey: username
  - remoteRef:
      key: grafana-db
      property: password
    secretKey: password
  refreshInterval: 30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    template:
      type: kubernetes.io/basic-auth
