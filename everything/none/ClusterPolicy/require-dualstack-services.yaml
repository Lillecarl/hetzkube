apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-dualstack-services
spec:
  rules:
  - match:
      resources:
        kinds:
        - Service
    mutate:
      patchStrategicMerge:
        spec:
          ipFamilies:
          - IPv4
          - IPv6
          ipFamilyPolicy: RequireDualStack
    name: set-require-dualstack
