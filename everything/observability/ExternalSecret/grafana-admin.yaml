apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  data:
  - remoteRef:
      key: name:grafana-admin
      property: username
    secretKey: username
  - remoteRef:
      key: name:grafana-admin
      property: password
    secretKey: password
  refreshInterval: 30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway
  target:
    template:
      type: kubernetes.io/basic-auth
