apiVersion: external-secrets.io/v1
ekn:
  gitOpsTarget: everything
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: observability
spec:
  data:
  - remoteRef:
      key: name:keycloak-grafana
    secretKey: client-secret
  refreshInterval: 30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway
  target:
    template:
      type: Opaque
