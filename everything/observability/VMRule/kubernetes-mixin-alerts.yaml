apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  labels:
    role: metrics
  name: kubernetes-mixin-alerts
  namespace: observability
spec:
  groups:
  - name: kubernetes-apps
    rules:
    - alert: KubePodCrashLooping
      annotations:
        description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container
          }}) is in waiting state (reason: "CrashLoopBackOff").'
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepodcrashlooping
        summary: Pod is crash looping.
      expr: 'max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff",
        job="kube-state-metrics"}[5m]) >= 1

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubePodNotReady
      annotations:
        description: Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-ready
          state for longer than 15 minutes.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepodnotready
        summary: Pod has been in a non-ready state for more than 15 minutes.
      expr: "sum by (namespace, pod, job, cluster) (\n  max by(namespace, pod, job,
        cluster) (\n    kube_pod_status_phase{job=\"kube-state-metrics\", phase=~\"Pending|Unknown\"}\n
        \ ) * on(namespace, pod, cluster) group_left(owner_kind) topk by(namespace,
        pod, cluster) (\n    1, max by(namespace, pod, owner_kind, cluster) (kube_pod_owner{owner_kind!=\"Job\"})\n
        \ )\n) > 0\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeDeploymentGenerationMismatch
      annotations:
        description: Deployment generation for {{ $labels.namespace }}/{{ $labels.deployment
          }} does not match, this indicates that the Deployment has failed but has
          not been rolled back.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedeploymentgenerationmismatch
        summary: Deployment generation mismatch due to possible roll-back
      expr: "kube_deployment_status_observed_generation{job=\"kube-state-metrics\"}\n
        \ !=\nkube_deployment_metadata_generation{job=\"kube-state-metrics\"}\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeDeploymentReplicasMismatch
      annotations:
        description: Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has
          not matched the expected number of replicas for longer than 15 minutes.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedeploymentreplicasmismatch
        summary: Deployment has not matched the expected number of replicas.
      expr: "(\n  kube_deployment_spec_replicas{job=\"kube-state-metrics\"}\n    >\n
        \ kube_deployment_status_replicas_available{job=\"kube-state-metrics\"}\n)
        and (\n  changes(kube_deployment_status_replicas_updated{job=\"kube-state-metrics\"}[10m])\n
        \   ==\n  0\n)\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeDeploymentRolloutStuck
      annotations:
        description: Rollout of deployment {{ $labels.namespace }}/{{ $labels.deployment
          }} is not progressing for longer than 15 minutes.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedeploymentrolloutstuck
        summary: Deployment rollout is not progressing.
      expr: 'kube_deployment_status_condition{condition="Progressing", status="false",job="kube-state-metrics"}

        != 0

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeStatefulSetReplicasMismatch
      annotations:
        description: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }}
          has not matched the expected number of replicas for longer than 15 minutes.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubestatefulsetreplicasmismatch
        summary: StatefulSet has not matched the expected number of replicas.
      expr: "(\n  kube_statefulset_status_replicas_ready{job=\"kube-state-metrics\"}\n
        \   !=\n  kube_statefulset_replicas{job=\"kube-state-metrics\"}\n) and (\n
        \ changes(kube_statefulset_status_replicas_updated{job=\"kube-state-metrics\"}[10m])\n
        \   ==\n  0\n)\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeStatefulSetGenerationMismatch
      annotations:
        description: StatefulSet generation for {{ $labels.namespace }}/{{ $labels.statefulset
          }} does not match, this indicates that the StatefulSet has failed but has
          not been rolled back.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubestatefulsetgenerationmismatch
        summary: StatefulSet generation mismatch due to possible roll-back
      expr: "kube_statefulset_status_observed_generation{job=\"kube-state-metrics\"}\n
        \ !=\nkube_statefulset_metadata_generation{job=\"kube-state-metrics\"}\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeStatefulSetUpdateNotRolledOut
      annotations:
        description: StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }}
          update has not been rolled out.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubestatefulsetupdatenotrolledout
        summary: StatefulSet update has not been rolled out.
      expr: "(\n  max by(namespace, statefulset, job, cluster) (\n    kube_statefulset_status_current_revision{job=\"kube-state-metrics\"}\n
        \     unless\n    kube_statefulset_status_update_revision{job=\"kube-state-metrics\"}\n
        \ )\n    * on(namespace, statefulset, job, cluster)\n  (\n    kube_statefulset_replicas{job=\"kube-state-metrics\"}\n
        \     !=\n    kube_statefulset_status_replicas_updated{job=\"kube-state-metrics\"}\n
        \ )\n)  and on(namespace, statefulset, job, cluster) (\n  changes(kube_statefulset_status_replicas_updated{job=\"kube-state-metrics\"}[5m])\n
        \   ==\n  0\n)\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeDaemonSetRolloutStuck
      annotations:
        description: DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has
          not finished or progressed for at least 15m.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedaemonsetrolloutstuck
        summary: DaemonSet rollout is stuck.
      expr: "(\n  (\n    kube_daemonset_status_current_number_scheduled{job=\"kube-state-metrics\"}\n
        \     !=\n    kube_daemonset_status_desired_number_scheduled{job=\"kube-state-metrics\"}\n
        \ ) or (\n    kube_daemonset_status_number_misscheduled{job=\"kube-state-metrics\"}\n
        \     !=\n    0\n  ) or (\n    kube_daemonset_status_updated_number_scheduled{job=\"kube-state-metrics\"}\n
        \     !=\n    kube_daemonset_status_desired_number_scheduled{job=\"kube-state-metrics\"}\n
        \ ) or (\n    kube_daemonset_status_number_available{job=\"kube-state-metrics\"}\n
        \     !=\n    kube_daemonset_status_desired_number_scheduled{job=\"kube-state-metrics\"}\n
        \ )\n) and (\n  changes(kube_daemonset_status_updated_number_scheduled{job=\"kube-state-metrics\"}[5m])\n
        \   ==\n  0\n)\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeContainerWaiting
      annotations:
        description: 'pod/{{ $labels.pod }} in namespace {{ $labels.namespace }} on
          container {{ $labels.container}} has been in waiting state for longer than
          1 hour. (reason: "{{ $labels.reason }}").'
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubecontainerwaiting
        summary: Pod container waiting longer than 1 hour
      expr: 'kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff",
        job="kube-state-metrics"} > 0

        '
      for: 1h
      labels:
        severity: warning
      record: ''
    - alert: KubeDaemonSetNotScheduled
      annotations:
        description: '{{ $value }} Pods of DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset
          }} are not scheduled.'
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedaemonsetnotscheduled
        summary: DaemonSet pods are not scheduled.
      expr: "kube_daemonset_status_desired_number_scheduled{job=\"kube-state-metrics\"}\n
        \ -\nkube_daemonset_status_current_number_scheduled{job=\"kube-state-metrics\"}
        > 0\n"
      for: 10m
      labels:
        severity: warning
      record: ''
    - alert: KubeDaemonSetMisScheduled
      annotations:
        description: '{{ $value }} Pods of DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset
          }} are running where they are not supposed to run.'
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedaemonsetmisscheduled
        summary: DaemonSet pods are misscheduled.
      expr: 'kube_daemonset_status_number_misscheduled{job="kube-state-metrics"} >
        0

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeJobNotCompleted
      annotations:
        description: Job {{ $labels.namespace }}/{{ $labels.job_name }} is taking
          more than {{ "43200" | humanizeDuration }} to complete.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubejobnotcompleted
        summary: Job did not complete in time
      expr: "time() - max by(namespace, job_name, cluster) (kube_job_status_start_time{job=\"kube-state-metrics\"}\n
        \ and\nkube_job_status_active{job=\"kube-state-metrics\"} > 0) > 43200\n"
      labels:
        severity: warning
      record: ''
    - alert: KubeJobFailed
      annotations:
        description: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to
          complete. Removing failed job after investigation should clear this alert.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubejobfailed
        summary: Job failed to complete.
      expr: 'kube_job_failed{job="kube-state-metrics"}  > 0

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeHpaReplicasMismatch
      annotations:
        description: HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler  }}
          has not matched the desired number of replicas for longer than 15 minutes.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubehpareplicasmismatch
        summary: HPA has not matched desired number of replicas.
      expr: "(kube_horizontalpodautoscaler_status_desired_replicas{job=\"kube-state-metrics\"}\n
        \ !=\nkube_horizontalpodautoscaler_status_current_replicas{job=\"kube-state-metrics\"})\n
        \ and\n(kube_horizontalpodautoscaler_status_current_replicas{job=\"kube-state-metrics\"}\n
        \ >\nkube_horizontalpodautoscaler_spec_min_replicas{job=\"kube-state-metrics\"})\n
        \ and\n(kube_horizontalpodautoscaler_status_current_replicas{job=\"kube-state-metrics\"}\n
        \ <\nkube_horizontalpodautoscaler_spec_max_replicas{job=\"kube-state-metrics\"})\n
        \ and\nchanges(kube_horizontalpodautoscaler_status_current_replicas{job=\"kube-state-metrics\"}[15m])
        == 0\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeHpaMaxedOut
      annotations:
        description: HPA {{ $labels.namespace }}/{{ $labels.horizontalpodautoscaler  }}
          has been running at max replicas for longer than 15 minutes.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubehpamaxedout
        summary: HPA is running at max replicas
      expr: "kube_horizontalpodautoscaler_status_current_replicas{job=\"kube-state-metrics\"}\n
        \ ==\nkube_horizontalpodautoscaler_spec_max_replicas{job=\"kube-state-metrics\"}\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubePdbNotEnoughHealthyPods
      annotations:
        description: PDB {{ $labels.namespace }}/{{ $labels.poddisruptionbudget }}
          expects {{ $value }} more healthy pods. The desired number of healthy pods
          has not been met for at least 15m.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepdbnotenoughhealthypods
        summary: PDB does not have enough healthy pods.
      expr: "(\n  kube_poddisruptionbudget_status_desired_healthy{job=\"kube-state-metrics\"}\n
        \ -\n  kube_poddisruptionbudget_status_current_healthy{job=\"kube-state-metrics\"}\n)\n>
        0\n"
      for: 15m
      labels:
        severity: warning
      record: ''
  - name: kubernetes-resources
    rules:
    - alert: KubeCPUOvercommit
      annotations:
        description: Cluster has overcommitted CPU resource requests for Pods by {{
          printf "%.2f" $value }} CPU shares and cannot tolerate node failure.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubecpuovercommit
        summary: Cluster has overcommitted CPU resource requests.
      expr: "# Non-HA clusters.\n(\n  (\n    sum(namespace_cpu:kube_pod_container_resource_requests:sum{})\n
        \   -\n    sum(kube_node_status_allocatable{resource=\"cpu\", job=\"kube-state-metrics\"})
        > 0\n  )\n  and\n  count(max by (node) (kube_node_role{job=\"kube-state-metrics\",
        role=\"control-plane\"})) < 3\n)\nor\n# HA clusters.\n(\n  sum(namespace_cpu:kube_pod_container_resource_requests:sum{})\n
        \ -\n  (\n    # Skip clusters with only one allocatable node.\n    (\n      sum(kube_node_status_allocatable{resource=\"cpu\",
        job=\"kube-state-metrics\"})\n      -\n      max(kube_node_status_allocatable{resource=\"cpu\",
        job=\"kube-state-metrics\"})\n    ) > 0\n  ) > 0\n)\n"
      for: 10m
      labels:
        severity: warning
      record: ''
    - alert: KubeMemoryOvercommit
      annotations:
        description: Cluster has overcommitted memory resource requests for Pods by
          {{ $value | humanize }} bytes and cannot tolerate node failure.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubememoryovercommit
        summary: Cluster has overcommitted memory resource requests.
      expr: "# Non-HA clusters.\n(\n  (\n    sum(namespace_memory:kube_pod_container_resource_requests:sum{})\n
        \   -\n    sum(kube_node_status_allocatable{resource=\"memory\", job=\"kube-state-metrics\"})
        > 0\n  )\n  and\n  count(max by (node) (kube_node_role{job=\"kube-state-metrics\",
        role=\"control-plane\"})) < 3\n)\nor\n# HA clusters.\n(\n  sum(namespace_memory:kube_pod_container_resource_requests:sum{})\n
        \ -\n  (\n    # Skip clusters with only one allocatable node.\n    (\n      sum(kube_node_status_allocatable{resource=\"memory\",
        job=\"kube-state-metrics\"})\n      -\n      max(kube_node_status_allocatable{resource=\"memory\",
        job=\"kube-state-metrics\"})\n    ) > 0\n  ) > 0\n)\n"
      for: 10m
      labels:
        severity: warning
      record: ''
    - alert: KubeCPUQuotaOvercommit
      annotations:
        description: Cluster has overcommitted CPU resource requests for Namespaces.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubecpuquotaovercommit
        summary: Cluster has overcommitted CPU resource requests.
      expr: "sum (\n  min without(resource) (kube_resourcequota{job=\"kube-state-metrics\",
        type=\"hard\", resource=~\"(cpu|requests.cpu)\"})\n)\n/\nsum (\n  kube_node_status_allocatable{resource=\"cpu\",
        job=\"kube-state-metrics\"}\n) > 1.5\n"
      for: 5m
      labels:
        severity: warning
      record: ''
    - alert: KubeMemoryQuotaOvercommit
      annotations:
        description: Cluster has overcommitted memory resource requests for Namespaces.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubememoryquotaovercommit
        summary: Cluster has overcommitted memory resource requests.
      expr: "sum (\n  min without(resource) (kube_resourcequota{job=\"kube-state-metrics\",
        type=\"hard\", resource=~\"(memory|requests.memory)\"})\n)\n/\nsum (\n  kube_node_status_allocatable{resource=\"memory\",
        job=\"kube-state-metrics\"}\n) > 1.5\n"
      for: 5m
      labels:
        severity: warning
      record: ''
    - alert: KubeQuotaAlmostFull
      annotations:
        description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
          }} of its {{ $labels.resource }} quota.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubequotaalmostfull
        summary: Namespace quota is going to be full.
      expr: "max without (instance, job, type) (\n  kube_resourcequota{job=\"kube-state-metrics\",
        type=\"used\"}\n)\n/ on (cluster, namespace, resource, resourcequota) group_left()\n(\n
        \ max without (instance, job, type) (\n    kube_resourcequota{job=\"kube-state-metrics\",
        type=\"hard\"}\n  ) > 0\n)\n> 0.9 < 1\n"
      for: 15m
      labels:
        severity: info
      record: ''
    - alert: KubeQuotaFullyUsed
      annotations:
        description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
          }} of its {{ $labels.resource }} quota.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubequotafullyused
        summary: Namespace quota is fully used.
      expr: "max without (instance, job, type) (\n  kube_resourcequota{job=\"kube-state-metrics\",
        type=\"used\"}\n)\n/ on (cluster, namespace, resource, resourcequota) group_left()\n(\n
        \ max without (instance, job, type) (\n    kube_resourcequota{job=\"kube-state-metrics\",
        type=\"hard\"}\n  ) > 0\n)\n== 1\n"
      for: 15m
      labels:
        severity: info
      record: ''
    - alert: KubeQuotaExceeded
      annotations:
        description: Namespace {{ $labels.namespace }} is using {{ $value | humanizePercentage
          }} of its {{ $labels.resource }} quota.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubequotaexceeded
        summary: Namespace quota has exceeded the limits.
      expr: "max without (instance, job, type) (\n  kube_resourcequota{job=\"kube-state-metrics\",
        type=\"used\"}\n)\n/ on (cluster, namespace, resource, resourcequota) group_left()\n(\n
        \ max without (instance, job, type) (\n    kube_resourcequota{job=\"kube-state-metrics\",
        type=\"hard\"}\n  ) > 0\n) > 1\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: CPUThrottlingHigh
      annotations:
        description: '{{ $value | humanizePercentage }} throttling of CPU in namespace
          {{ $labels.namespace }} for container {{ $labels.container }} in pod {{
          $labels.pod }}.'
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-cputhrottlinghigh
        summary: Processes experience elevated CPU throttling.
      expr: "sum without (id, metrics_path, name, image, endpoint, job, node) (\n
        \ topk by (cluster, namespace, pod, container, instance) (1,\n    increase(\n
        \     container_cpu_cfs_throttled_periods_total{container!=\"\", job=\"cadvisor\",
        }\n    [5m])\n  )\n)\n/ on (cluster, namespace, pod, container, instance)
        group_left\nsum without (id, metrics_path, name, image, endpoint, job, node)
        (\n  topk by (cluster, namespace, pod, container, instance) (1,\n    increase(\n
        \     container_cpu_cfs_periods_total{job=\"cadvisor\", }\n    [5m])\n  )\n)\n>
        ( 25 / 100 )\n"
      for: 15m
      labels:
        severity: info
      record: ''
  - name: kubernetes-storage
    rules:
    - alert: KubePersistentVolumeFillingUp
      annotations:
        description: The PersistentVolume claimed by {{ $labels.persistentvolumeclaim
          }} in Namespace {{ $labels.namespace }} {{ with $labels.cluster -}} on Cluster
          {{ . }} {{- end }} is only {{ $value | humanizePercentage }} free.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepersistentvolumefillingup
        summary: PersistentVolume is filling up.
      expr: "(\n  kubelet_volume_stats_available_bytes{job=\"kubelet\"}\n    /\n  kubelet_volume_stats_capacity_bytes{job=\"kubelet\"}\n)
        < 0.03\nand\nkubelet_volume_stats_used_bytes{job=\"kubelet\"} > 0\nunless
        on(cluster, namespace, persistentvolumeclaim)\nkube_persistentvolumeclaim_access_mode{
        access_mode=\"ReadOnlyMany\"} == 1\nunless on(cluster, namespace, persistentvolumeclaim)\nkube_persistentvolumeclaim_labels{label_excluded_from_alerts=\"true\"}
        == 1\n"
      for: 1m
      labels:
        severity: critical
      record: ''
    - alert: KubePersistentVolumeFillingUp
      annotations:
        description: Based on recent sampling, the PersistentVolume claimed by {{
          $labels.persistentvolumeclaim }} in Namespace {{ $labels.namespace }} {{
          with $labels.cluster -}} on Cluster {{ . }} {{- end }} is expected to fill
          up within four days. Currently {{ $value | humanizePercentage }} is available.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepersistentvolumefillingup
        summary: PersistentVolume is filling up.
      expr: "(\n  kubelet_volume_stats_available_bytes{job=\"kubelet\"}\n    /\n  kubelet_volume_stats_capacity_bytes{job=\"kubelet\"}\n)
        < 0.15\nand\nkubelet_volume_stats_used_bytes{job=\"kubelet\"} > 0\nand\npredict_linear(kubelet_volume_stats_available_bytes{job=\"kubelet\"}[6h],
        4 * 24 * 3600) < 0\nunless on(cluster, namespace, persistentvolumeclaim)\nkube_persistentvolumeclaim_access_mode{
        access_mode=\"ReadOnlyMany\"} == 1\nunless on(cluster, namespace, persistentvolumeclaim)\nkube_persistentvolumeclaim_labels{label_excluded_from_alerts=\"true\"}
        == 1\n"
      for: 1h
      labels:
        severity: warning
      record: ''
    - alert: KubePersistentVolumeInodesFillingUp
      annotations:
        description: The PersistentVolume claimed by {{ $labels.persistentvolumeclaim
          }} in Namespace {{ $labels.namespace }} {{ with $labels.cluster -}} on Cluster
          {{ . }} {{- end }} only has {{ $value | humanizePercentage }} free inodes.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepersistentvolumeinodesfillingup
        summary: PersistentVolumeInodes are filling up.
      expr: "(\n  kubelet_volume_stats_inodes_free{job=\"kubelet\"}\n    /\n  kubelet_volume_stats_inodes{job=\"kubelet\"}\n)
        < 0.03\nand\nkubelet_volume_stats_inodes_used{job=\"kubelet\"} > 0\nunless
        on(cluster, namespace, persistentvolumeclaim)\nkube_persistentvolumeclaim_access_mode{
        access_mode=\"ReadOnlyMany\"} == 1\nunless on(cluster, namespace, persistentvolumeclaim)\nkube_persistentvolumeclaim_labels{label_excluded_from_alerts=\"true\"}
        == 1\n"
      for: 1m
      labels:
        severity: critical
      record: ''
    - alert: KubePersistentVolumeInodesFillingUp
      annotations:
        description: Based on recent sampling, the PersistentVolume claimed by {{
          $labels.persistentvolumeclaim }} in Namespace {{ $labels.namespace }} {{
          with $labels.cluster -}} on Cluster {{ . }} {{- end }} is expected to run
          out of inodes within four days. Currently {{ $value | humanizePercentage
          }} of its inodes are free.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepersistentvolumeinodesfillingup
        summary: PersistentVolumeInodes are filling up.
      expr: "(\n  kubelet_volume_stats_inodes_free{job=\"kubelet\"}\n    /\n  kubelet_volume_stats_inodes{job=\"kubelet\"}\n)
        < 0.15\nand\nkubelet_volume_stats_inodes_used{job=\"kubelet\"} > 0\nand\npredict_linear(kubelet_volume_stats_inodes_free{job=\"kubelet\"}[6h],
        4 * 24 * 3600) < 0\nunless on(cluster, namespace, persistentvolumeclaim)\nkube_persistentvolumeclaim_access_mode{
        access_mode=\"ReadOnlyMany\"} == 1\nunless on(cluster, namespace, persistentvolumeclaim)\nkube_persistentvolumeclaim_labels{label_excluded_from_alerts=\"true\"}
        == 1\n"
      for: 1h
      labels:
        severity: warning
      record: ''
    - alert: KubePersistentVolumeErrors
      annotations:
        description: The persistent volume {{ $labels.persistentvolume }} {{ with
          $labels.cluster -}} on Cluster {{ . }} {{- end }} has status {{ $labels.phase
          }}.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepersistentvolumeerrors
        summary: PersistentVolume is having issues with provisioning.
      expr: 'kube_persistentvolume_status_phase{phase=~"Failed|Pending",job="kube-state-metrics"}
        > 0

        '
      for: 5m
      labels:
        severity: critical
      record: ''
  - name: kubernetes-system
    rules:
    - alert: KubeVersionMismatch
      annotations:
        description: There are {{ $value }} different semantic versions of Kubernetes
          components running.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeversionmismatch
        summary: Different semantic versions of Kubernetes components running.
      expr: 'count by (cluster) (count by (git_version, cluster) (label_replace(kubernetes_build_info{job!~"kube-dns|coredns"},"git_version","$1","git_version","(v[0-9]*.[0-9]*).*")))
        > 1

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeClientErrors
      annotations:
        description: Kubernetes API server client '{{ $labels.job }}/{{ $labels.instance
          }}' is experiencing {{ $value | humanizePercentage }} errors.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeclienterrors
        summary: Kubernetes API server client is experiencing errors.
      expr: "(sum(rate(rest_client_requests_total{job=\"kube-apiserver\",code=~\"5..\"}[5m]))
        by (cluster, instance, job, namespace)\n  /\nsum(rate(rest_client_requests_total{job=\"kube-apiserver\"}[5m]))
        by (cluster, instance, job, namespace))\n> 0.01\n"
      for: 15m
      labels:
        severity: warning
      record: ''
  - name: kube-apiserver-slos
    rules:
    - alert: KubeAPIErrorBudgetBurn
      annotations:
        description: The API server is burning too much error budget.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeapierrorbudgetburn
        summary: The API server is burning too much error budget.
      expr: 'sum by(cluster) (apiserver_request:burnrate1h) > (14.40 * 0.01000)

        and on(cluster)

        sum by(cluster) (apiserver_request:burnrate5m) > (14.40 * 0.01000)

        '
      for: 2m
      labels:
        long: 1h
        severity: critical
        short: 5m
      record: ''
    - alert: KubeAPIErrorBudgetBurn
      annotations:
        description: The API server is burning too much error budget.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeapierrorbudgetburn
        summary: The API server is burning too much error budget.
      expr: 'sum by(cluster) (apiserver_request:burnrate6h) > (6.00 * 0.01000)

        and on(cluster)

        sum by(cluster) (apiserver_request:burnrate30m) > (6.00 * 0.01000)

        '
      for: 15m
      labels:
        long: 6h
        severity: critical
        short: 30m
      record: ''
    - alert: KubeAPIErrorBudgetBurn
      annotations:
        description: The API server is burning too much error budget.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeapierrorbudgetburn
        summary: The API server is burning too much error budget.
      expr: 'sum by(cluster) (apiserver_request:burnrate1d) > (3.00 * 0.01000)

        and on(cluster)

        sum by(cluster) (apiserver_request:burnrate2h) > (3.00 * 0.01000)

        '
      for: 1h
      labels:
        long: 1d
        severity: warning
        short: 2h
      record: ''
    - alert: KubeAPIErrorBudgetBurn
      annotations:
        description: The API server is burning too much error budget.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeapierrorbudgetburn
        summary: The API server is burning too much error budget.
      expr: 'sum by(cluster) (apiserver_request:burnrate3d) > (1.00 * 0.01000)

        and on(cluster)

        sum by(cluster) (apiserver_request:burnrate6h) > (1.00 * 0.01000)

        '
      for: 3h
      labels:
        long: 3d
        severity: warning
        short: 6h
      record: ''
  - name: kubernetes-system-apiserver
    rules:
    - alert: KubeClientCertificateExpiration
      annotations:
        description: A client certificate used to authenticate to kubernetes apiserver
          is expiring in less than 7.0 days.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeclientcertificateexpiration
        summary: Client certificate is about to expire.
      expr: 'histogram_quantile(0.01, sum without (namespace, service, endpoint) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="kube-apiserver"}[5m])))
        < 604800

        and

        on(job, cluster, instance) apiserver_client_certificate_expiration_seconds_count{job="kube-apiserver"}
        > 0

        '
      for: 5m
      labels:
        severity: warning
      record: ''
    - alert: KubeClientCertificateExpiration
      annotations:
        description: A client certificate used to authenticate to kubernetes apiserver
          is expiring in less than 24.0 hours.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeclientcertificateexpiration
        summary: Client certificate is about to expire.
      expr: 'histogram_quantile(0.01, sum without (namespace, service, endpoint) (rate(apiserver_client_certificate_expiration_seconds_bucket{job="kube-apiserver"}[5m])))
        < 86400

        and

        on(job, cluster, instance) apiserver_client_certificate_expiration_seconds_count{job="kube-apiserver"}
        > 0

        '
      for: 5m
      labels:
        severity: critical
      record: ''
    - alert: KubeAggregatedAPIErrors
      annotations:
        description: Kubernetes aggregated API {{ $labels.instance }}/{{ $labels.name
          }} has reported {{ $labels.reason }} errors.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeaggregatedapierrors
        summary: Kubernetes aggregated API has reported errors.
      expr: 'sum by(cluster, instance, name, reason)(increase(aggregator_unavailable_apiservice_total{job="kube-apiserver"}[1m]))
        > 0

        '
      for: 10m
      labels:
        severity: warning
      record: ''
    - alert: KubeAggregatedAPIDown
      annotations:
        description: Kubernetes aggregated API {{ $labels.name }}/{{ $labels.namespace
          }} has been only {{ $value | humanize }}% available over the last 10m.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeaggregatedapidown
        summary: Kubernetes aggregated API is down.
      expr: '(1 - max by(name, namespace, cluster)(avg_over_time(aggregator_unavailable_apiservice{job="kube-apiserver"}[10m])))
        * 100 < 85

        '
      for: 5m
      labels:
        severity: warning
      record: ''
    - alert: KubeAPIDown
      annotations:
        description: KubeAPI has disappeared from Prometheus target discovery.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeapidown
        summary: Target disappeared from Prometheus target discovery.
      expr: 'absent(up{job="kube-apiserver"})

        '
      for: 15m
      labels:
        severity: critical
      record: ''
    - alert: KubeAPITerminatedRequests
      annotations:
        description: The kubernetes apiserver has terminated {{ $value | humanizePercentage
          }} of its incoming requests.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeapiterminatedrequests
        summary: The kubernetes apiserver has terminated {{ $value | humanizePercentage
          }} of its incoming requests.
      expr: 'sum by(cluster) (rate(apiserver_request_terminations_total{job="kube-apiserver"}[10m]))
        / ( sum by(cluster) (rate(apiserver_request_total{job="kube-apiserver"}[10m]))
        + sum by(cluster) (rate(apiserver_request_terminations_total{job="kube-apiserver"}[10m]))
        ) > 0.20

        '
      for: 5m
      labels:
        severity: warning
      record: ''
  - name: kubernetes-system-kubelet
    rules:
    - alert: KubeNodeNotReady
      annotations:
        description: '{{ $labels.node }} has been unready for more than 15 minutes.'
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubenodenotready
        summary: Node is not ready.
      expr: 'kube_node_status_condition{job="kube-state-metrics",condition="Ready",status="true"}
        == 0

        and on (cluster, node)

        kube_node_spec_unschedulable{job="kube-state-metrics"} == 0

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeNodePressure
      annotations:
        description: '{{ $labels.node }} has active Condition {{ $labels.condition
          }}. This is caused by resource usage exceeding eviction thresholds.'
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubenodepressure
        summary: Node has as active Condition.
      expr: 'kube_node_status_condition{job="kube-state-metrics",condition=~"(MemoryPressure|DiskPressure|PIDPressure)",status="true"}
        == 1

        and on (cluster, node)

        kube_node_spec_unschedulable{job="kube-state-metrics"} == 0

        '
      for: 10m
      labels:
        severity: info
      record: ''
    - alert: KubeNodeUnreachable
      annotations:
        description: '{{ $labels.node }} is unreachable and some workloads may be
          rescheduled.'
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubenodeunreachable
        summary: Node is unreachable.
      expr: '(kube_node_spec_taint{job="kube-state-metrics",key="node.kubernetes.io/unreachable",effect="NoSchedule"}
        unless ignoring(key,value) kube_node_spec_taint{job="kube-state-metrics",key=~"ToBeDeletedByClusterAutoscaler|cloud.google.com/impending-node-termination|aws-node-termination-handler/spot-itn"})
        == 1

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeletTooManyPods
      annotations:
        description: Kubelet '{{ $labels.node }}' is running at {{ $value | humanizePercentage
          }} of its Pod capacity.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubelettoomanypods
        summary: Kubelet is running at capacity.
      expr: "(\n  max by (cluster, instance) (\n    kubelet_running_pods{job=\"kubelet\"}
        > 1\n  )\n  * on (cluster, instance) group_left(node)\n  max by (cluster,
        instance, node) (\n    kubelet_node_name{job=\"kubelet\"}\n  )\n)\n/ on (cluster,
        node) group_left()\nmax by (cluster, node) (\n  kube_node_status_capacity{job=\"kube-state-metrics\",
        resource=\"pods\"} != 1\n) > 0.95\n"
      for: 15m
      labels:
        severity: info
      record: ''
    - alert: KubeNodeReadinessFlapping
      annotations:
        description: The readiness status of node {{ $labels.node }} has changed {{
          $value }} times in the last 15 minutes.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubenodereadinessflapping
        summary: Node readiness status is flapping.
      expr: 'sum(changes(kube_node_status_condition{job="kube-state-metrics",status="true",condition="Ready"}[15m]))
        by (cluster, node) > 2

        and on (cluster, node)

        kube_node_spec_unschedulable{job="kube-state-metrics"} == 0

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeNodeEviction
      annotations:
        description: Node {{ $labels.node }} is evicting Pods due to {{ $labels.eviction_signal
          }}.  Eviction occurs when eviction thresholds are crossed, typically caused
          by Pods exceeding RAM/ephemeral-storage limits.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubenodeeviction
        summary: Node is evicting pods.
      expr: "sum(rate(kubelet_evictions{job=\"kubelet\"}[15m])) by(cluster, eviction_signal,
        instance)\n* on (cluster, instance) group_left(node)\nmax by (cluster, instance,
        node) (\n  kubelet_node_name{job=\"kubelet\"}\n)\n> 0\n"
      for: 0s
      labels:
        severity: info
      record: ''
    - alert: KubeletPlegDurationHigh
      annotations:
        description: The Kubelet Pod Lifecycle Event Generator has a 99th percentile
          duration of {{ $value }} seconds on node {{ $labels.node }}.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletplegdurationhigh
        summary: Kubelet Pod Lifecycle Event Generator is taking too long to relist.
      expr: 'node_quantile:kubelet_pleg_relist_duration_seconds:histogram_quantile{quantile="0.99"}
        >= 10

        '
      for: 5m
      labels:
        severity: warning
      record: ''
    - alert: KubeletPodStartUpLatencyHigh
      annotations:
        description: Kubelet Pod startup 99th percentile latency is {{ $value }} seconds
          on node {{ $labels.node }}.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletpodstartuplatencyhigh
        summary: Kubelet Pod startup latency is too high.
      expr: "histogram_quantile(0.99,\n  sum by (cluster, instance, le) (\n    topk
        by (cluster, instance, le, operation_type) (1,\n      rate(kubelet_pod_worker_duration_seconds_bucket{job=\"kubelet\"}[5m])\n
        \   )\n  )\n)\n* on(cluster, instance) group_left(node)\ntopk by (cluster,
        instance, node) (1,\n  kubelet_node_name{job=\"kubelet\"}\n)\n> 60\n"
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeletClientCertificateExpiration
      annotations:
        description: Client certificate for Kubelet on node {{ $labels.node }} expires
          in {{ $value | humanizeDuration }}.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletclientcertificateexpiration
        summary: Kubelet client certificate is about to expire.
      expr: 'kubelet_certificate_manager_client_ttl_seconds < 604800

        '
      labels:
        severity: warning
      record: ''
    - alert: KubeletClientCertificateExpiration
      annotations:
        description: Client certificate for Kubelet on node {{ $labels.node }} expires
          in {{ $value | humanizeDuration }}.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletclientcertificateexpiration
        summary: Kubelet client certificate is about to expire.
      expr: 'kubelet_certificate_manager_client_ttl_seconds < 86400

        '
      labels:
        severity: critical
      record: ''
    - alert: KubeletServerCertificateExpiration
      annotations:
        description: Server certificate for Kubelet on node {{ $labels.node }} expires
          in {{ $value | humanizeDuration }}.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletservercertificateexpiration
        summary: Kubelet server certificate is about to expire.
      expr: 'kubelet_certificate_manager_server_ttl_seconds < 604800

        '
      labels:
        severity: warning
      record: ''
    - alert: KubeletServerCertificateExpiration
      annotations:
        description: Server certificate for Kubelet on node {{ $labels.node }} expires
          in {{ $value | humanizeDuration }}.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletservercertificateexpiration
        summary: Kubelet server certificate is about to expire.
      expr: 'kubelet_certificate_manager_server_ttl_seconds < 86400

        '
      labels:
        severity: critical
      record: ''
    - alert: KubeletClientCertificateRenewalErrors
      annotations:
        description: Kubelet on node {{ $labels.node }} has failed to renew its client
          certificate ({{ $value | humanize }} errors in the last 5 minutes).
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletclientcertificaterenewalerrors
        summary: Kubelet has failed to renew its client certificate.
      expr: 'increase(kubelet_certificate_manager_client_expiration_renew_errors[5m])
        > 0

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeletServerCertificateRenewalErrors
      annotations:
        description: Kubelet on node {{ $labels.node }} has failed to renew its server
          certificate ({{ $value | humanize }} errors in the last 5 minutes).
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletservercertificaterenewalerrors
        summary: Kubelet has failed to renew its server certificate.
      expr: 'increase(kubelet_server_expiration_renew_errors[5m]) > 0

        '
      for: 15m
      labels:
        severity: warning
      record: ''
    - alert: KubeletDown
      annotations:
        description: Kubelet has disappeared from Prometheus target discovery.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeletdown
        summary: Target disappeared from Prometheus target discovery.
      expr: 'absent(up{job="kubelet"})

        '
      for: 15m
      labels:
        severity: critical
      record: ''
  - name: kubernetes-system-scheduler
    rules:
    - alert: KubeSchedulerDown
      annotations:
        description: KubeScheduler has disappeared from Prometheus target discovery.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubeschedulerdown
        summary: Target disappeared from Prometheus target discovery.
      expr: 'absent(up{job="kube-scheduler"})

        '
      for: 15m
      labels:
        severity: critical
      record: ''
  - name: kubernetes-system-controller-manager
    rules:
    - alert: KubeControllerManagerDown
      annotations:
        description: KubeControllerManager has disappeared from Prometheus target
          discovery.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubecontrollermanagerdown
        summary: Target disappeared from Prometheus target discovery.
      expr: 'absent(up{job="kube-controller-manager"})

        '
      for: 15m
      labels:
        severity: critical
      record: ''
