apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: telegram
  namespace: observability
spec:
  receivers:
  - name: telegram
    telegram_configs:
    - bot_token:
        key: token
        name: telegram
      chat_id: 8507658503
  route:
    group_by:
    - namespace
    - alertname
    group_interval: 5m
    group_wait: 30s
    receiver: telegram
    repeat_interval: 4h
