apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: logs
  namespace: observability
spec:
  datasource:
    url: http://vlsingle-logs:9428/select/logsql/query
  evaluationInterval: 30s
  extraArgs:
    external.url: https://vmalert-logs.lillecarl.com
  notifiers:
  - url: http://vmalertmanager-alertmanager.observability.svc:9093
  remoteWrite:
    url: http://vmsingle-metrics:8429
  ruleSelector:
    matchLabels:
      role: logs
