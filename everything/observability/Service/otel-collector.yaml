apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: k8s-events
    app.kubernetes.io/name: otel-collector
  name: otel-collector
  namespace: observability
spec:
  ipFamilyPolicy: RequireDualStack
  ports:
  - name: metrics
    port: 8888
    protocol: TCP
    targetPort: metrics
  selector:
    app.kubernetes.io/component: k8s-events
    app.kubernetes.io/name: otel-collector
  type: ClusterIP
