apiVersion: operator.victoriametrics.com/v1
ekn:
  gitOpsTarget: everything
kind: VLSingle
metadata:
  name: logs
  namespace: observability
spec:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
  retentionPeriod: '71'
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
