apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  labels:
    dashboards: grafana
  name: grafana
  namespace: observability
spec:
  config:
    auth.generic_oauth:
      allow_sign_up: 'true'
      api_url: https://keycloak.lillecarl.com/realms/auth/protocol/openid-connect/userinfo
      auth_url: https://keycloak.lillecarl.com/realms/auth/protocol/openid-connect/auth
      client_id: grafana
      client_secret: $__file{/etc/secrets/oidc/client-secret}
      enabled: 'true'
      name: Keycloak
      role_attribute_path: contains(realm_access.roles[*], 'admin') && 'Admin' ||
        contains(realm_access.roles[*], 'editor') && 'Editor' || 'Viewer'
      scopes: openid profile email
      token_url: https://keycloak.lillecarl.com/realms/auth/protocol/openid-connect/token
      use_pkce: 'true'
    database:
      host: pg0-rw.database.svc.cluster.local:5432
      name: grafana
      password: $__file{/etc/secrets/db/password}
      type: postgres
      user: $__file{/etc/secrets/db/username}
    server:
      root_url: https://grafana.lillecarl.com
  deployment:
    spec:
      template:
        spec:
          containers:
          - env:
            - name: GF_INSTALL_PLUGINS
              value: victoriametrics-logs-datasource,victoriametrics-metrics-datasource
            name: grafana
            volumeMounts:
            - mountPath: /etc/secrets/oidc
              name: oidc-secret
              readOnly: true
            - mountPath: /etc/secrets/db
              name: db-creds
              readOnly: true
          securityContext:
            fsGroup: 472
            runAsGroup: 472
            runAsUser: 472
          volumes:
          - name: oidc-secret
            secret:
              defaultMode: 420
              secretName: grafana-oidc
          - name: db-creds
            secret:
              defaultMode: 420
              secretName: pg0-grafana
  httpRoute:
    spec:
      hostnames:
      - grafana.lillecarl.com
      parentRefs:
      - name: default
        namespace: kube-system
      rules:
      - backendRefs:
        - name: grafana-service
          port: 3000
        matches:
        - path:
            type: PathPrefix
            value: /
  persistentVolumeClaim:
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: hcloud-volumes
