apiVersion: operator.victoriametrics.com/v1beta1
ekn:
  gitOpsTarget: everything
kind: VMSingle
metadata:
  name: metrics
  namespace: observability
spec:
  replicaCount: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
  retentionPeriod: 1d
  storage:
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
