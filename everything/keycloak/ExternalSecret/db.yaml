apiVersion: external-secrets.io/v1
ekn:
  gitOpsTarget: everything
kind: ExternalSecret
metadata:
  name: db
  namespace: keycloak
spec:
  data:
  - remoteRef:
      key: name:keycloak-db
      property: username
    secretKey: username
  - remoteRef:
      key: name:keycloak-db
      property: password
    secretKey: password
  refreshInterval: 30m0s
  secretStoreRef:
    kind: ClusterSecretStore
    name: scaleway
  target:
    template:
      type: kubernetes.io/basic-auth
